name: Deploy Backend to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR="$HOME/360-App"

            # Clone or pull latest
            if [ -d "$APP_DIR" ]; then
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/mkmk749278/360-App.git "$APP_DIR"
              cd "$APP_DIR"
            fi

            # Create .env if it doesn't exist
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            # Build and restart
            docker compose pull redis 2>/dev/null || true
            docker compose build --no-cache engine
            docker compose up -d

            # Wait and verify health with retries
            echo "Waiting for services to start..."
            MAX_RETRIES=6
            RETRY_INTERVAL=10
            for i in $(seq 1 $MAX_RETRIES); do
              sleep $RETRY_INTERVAL
              if curl -sf http://localhost:8080/health; then
                echo ""
                echo "✅ API health check passed"
                break
              fi
              echo "⏳ Health check attempt $i/$MAX_RETRIES failed, retrying..."
              if [ "$i" -eq "$MAX_RETRIES" ]; then
                echo "⚠️ API not ready after $MAX_RETRIES attempts — check logs with: docker compose logs engine"
              fi
            done

            docker compose ps
            echo "✅ Deployment complete"
