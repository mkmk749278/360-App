name: Deploy Backend to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_ssh_key: ${{ steps.check.outputs.has_ssh_key }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "has_ssh_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_ssh_key=false" >> $GITHUB_OUTPUT
            echo "⚠️ WARNING: VPS_SSH_KEY secret is not set. Skipping deployment."
            echo "To enable auto-deploy, add VPS_SSH_KEY to repository secrets."
          fi

  deploy:
    needs: check-secrets
    if: needs.check-secrets.outputs.has_ssh_key == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ACTIVE_CHANNEL_ID: ${{ secrets.TELEGRAM_ACTIVE_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST || '95.111.241.97' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_ACTIVE_CHANNEL_ID,TELEGRAM_ADMIN_CHAT_ID,TELEGRAM_FREE_CHANNEL_ID,BINANCE_API_KEY,BINANCE_API_SECRET,NEWS_API_KEY,OPENAI_API_KEY
          script: |
            set -e
            APP_DIR="$HOME/360-App"

            # Clone or pull latest
            if [ -d "$APP_DIR" ]; then
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/mkmk749278/360-App.git "$APP_DIR"
              cd "$APP_DIR"
            fi

            # Write .env from injected secrets (always overwrite to pick up new secrets)
            cat > .env << ENVEOF
TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
TELEGRAM_ACTIVE_CHANNEL_ID=${TELEGRAM_ACTIVE_CHANNEL_ID:-ID:-1003711676922}
TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-710718010}
TELEGRAM_FREE_CHANNEL_ID=${TELEGRAM_FREE_CHANNEL_ID:-ID:-1003782844881}
BINANCE_API_KEY=${BINANCE_API_KEY}
BINANCE_API_SECRET=${BINANCE_API_SECRET}
NEWS_API_KEY=${NEWS_API_KEY}
OPENAI_API_KEY=${OPENAI_API_KEY}
TOP50_FUTURES_ONLY=true
TOP50_FUTURES_COUNT=50
TOP50_UPDATE_INTERVAL_SECONDS=3600
BINANCE_REST_BASE=https://api.binance.com
BINANCE_WS_BASE=wss://stream.binance.com:9443/ws
BINANCE_FUTURES_REST_BASE=https://fapi.binance.com
BINANCE_FUTURES_WS_BASE=wss://fstream.binance.com/ws
LOG_LEVEL=INFO
LOG_DIR=logs
LOG_JSON=false
PAIR_FETCH_INTERVAL_HOURS=6
TOP_PAIRS_COUNT=50
SCAN_INTERVAL_SECONDS=1
SCAN_MIN_VOLUME_USD=1000000
REDIS_URL=redis://redis:6379/0
SECOND_EXCHANGE_URL=https://api.bybit.com/v5/market/tickers?category=linear
CIRCUIT_BREAKER_MAX_CONSECUTIVE_SL=3
CIRCUIT_BREAKER_MAX_HOURLY_SL=5
CIRCUIT_BREAKER_MAX_DAILY_DRAWDOWN_PCT=10.0
CIRCUIT_BREAKER_COOLDOWN_SECONDS=900
SCALP_SCAN_COOLDOWN=300
MAX_SCALP_SIGNALS=5
MAX_SCALP_FVG_SIGNALS=3
MAX_SCALP_CVD_SIGNALS=3
MAX_SCALP_VWAP_SIGNALS=3
MAX_SCALP_OBI_SIGNALS=3
MAX_SCALP_HOLD=3600
THESIS_COOLDOWN_SCALP=3600
INVALIDATION_MOMENTUM_THRESHOLD_SCALP=0.10
PERFORMANCE_TRACKER_PATH=data/signal_performance.json
FEAR_GREED_API_URL=https://api.alternative.me/fng/?limit=1
OPENAI_MODEL=gpt-4o-mini
ENVEOF
            echo "✅ .env written"

            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker
              systemctl start docker
            fi

            # Build and restart
            docker compose pull redis 2>/dev/null || true
            docker compose build --no-cache engine
            docker compose up -d

            # Wait and verify health with retries
            echo "Waiting for services to start..."
            MAX_RETRIES=12  # 12 × 10s = 120s total wait
            RETRY_INTERVAL=10
            for i in $(seq 1 $MAX_RETRIES); do
              sleep $RETRY_INTERVAL
              if curl -sf http://localhost:8080/health; then
                echo ""
                echo "✅ API health check passed"
                break
              fi
              echo "⏳ Health check attempt $i/$MAX_RETRIES failed, retrying..."
              if [ "$i" -eq "$MAX_RETRIES" ]; then
                echo "⚠️ API not ready after $MAX_RETRIES attempts"
                docker compose logs --tail=100 engine
                exit 1
              fi
            done

            docker compose ps
            echo "✅ Deployment complete at $(date)"
